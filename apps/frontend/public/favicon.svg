<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B19"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Rounded Container with Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Ambient Glow Behind Icon -->
  <circle cx="256" cy="256" r="140" fill="#00F5FF" opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="256" cy="220" r="100" fill="#8B5CF6" opacity="0.15" filter="url(#softGlow)"/>

  <!-- Modern Futuristic T and Trading Wave Geometry -->
  <g filter="url(#neonGlow)">
    <!-- Top Horizontal Crossbar of T (Sleek angled high-tech wings) -->
    <path d="M 120 160 L 392 160 C 404 160 412 170 408 182 L 394 216 C 390 224 382 230 372 230 L 298 230 L 298 376 C 298 392 284 406 268 406 L 244 406 C 228 406 214 392 214 376 L 214 230 L 140 230 C 130 230 122 224 118 216 L 104 182 C 100 170 108 160 120 160 Z" 
          fill="url(#cyanBlueGrad)" />

    <!-- Upward Growth Candlestick / AI Pulse Accents -->
    <!-- Left Candlestick Accent -->
    <rect x="148" y="260" width="16" height="56" rx="8" fill="#00F5FF" opacity="0.85"/>
    <line x1="156" y1="244" x2="156" y2="332" stroke="#00F5FF" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Rising Pulse Indicator -->
    <rect x="348" y="240" width="16" height="76" rx="8" fill="#00F5FF" opacity="0.95"/>
    <line x1="356" y1="220" x2="356" y2="332" stroke="#00F5FF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

    <!-- AI Nexus Dot (Glowing energy spark) -->
    <circle cx="396" cy="144" r="12" fill="#00F5FF" filter="url(#softGlow)"/>
    <circle cx="396" cy="144" r="7" fill="#FFFFFF"/>
  </g>
</svg>
