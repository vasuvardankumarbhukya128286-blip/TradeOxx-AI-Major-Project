<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#080E24"/>
      <stop offset="100%" stop-color="#02040A"/>
    </linearGradient>

    <!-- Border Gradient: Blue -> Purple -> Cyan -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <!-- Pulse Wave Stroke Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Glow Filter for Pulse Line -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="24" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.2"/>
      <stop offset="60%" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Glowing Border -->
  <rect x="24" y="24" width="464" height="464" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="12"/>

  <!-- Center Ambient Glow -->
  <circle cx="256" cy="256" r="160" fill="url(#centerGlow)"/>

  <!-- Signature Activity / Pulse Wave Icon -->
  <g filter="url(#neonGlow)">
    <path 
      d="M 64 256 L 140 256 L 198 420 L 314 92 L 372 256 L 448 256" 
      fill="none" 
      stroke="url(#pulseGrad)" 
      stroke-width="36" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Core White Centerline for Neon Pop -->
    <path 
      d="M 64 256 L 140 256 L 198 420 L 314 92 L 372 256 L 448 256" 
      fill="none" 
      stroke="#FFFFFF" 
      stroke-width="14" 
      stroke-linecap="round" 
      stroke-linejoin="round"
      stroke-opacity="0.9"
    />
  </g>
</svg>
